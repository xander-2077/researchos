# ResearchOS — single container: web UI + REST API + MCP (Streamable HTTP at /mcp)
# Start:  cp .env.example .env  (set RESEARCHOS_ADMIN_PASSWORD)  &&  docker compose up -d --build
# Remote access over Tailscale (optional):  docker compose --profile tailscale up -d
#   → https://<TS_HOSTNAME>.<your-tailnet>.ts.net   (see docs/deployment.md#option-a--tailscale-serve-docker-sidecar)
services:
  researchos:
    build:
      context: .
      args:
        # PyPI mirror used during the image build (set PIP_INDEX_URL in .env to change)
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    image: researchos:latest
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      RESEARCHOS_DATA_DIR: /data
      # Also read from .env via interpolation (lets `docker compose --env-file other.env` work).
      RESEARCHOS_ADMIN_PASSWORD: ${RESEARCHOS_ADMIN_PASSWORD:-}
    # Bound to localhost by default. Expose remotely only via an HTTPS reverse proxy or Tailscale
    # (see docs/deployment.md). Never publish this port directly to the internet.
    ports:
      - "${RESEARCHOS_BIND:-127.0.0.1}:${RESEARCHOS_PORT:-8000}:8000"
    volumes:
      - researchos-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  # Optional Tailscale sidecar: joins your tailnet as its own machine and uses Tailscale Serve to
  # publish ResearchOS over HTTPS *only inside the tailnet*. Userspace networking: no root,
  # no /dev/net/tun, no host network changes. Enabled with `--profile tailscale`
  # (or COMPOSE_PROFILES=tailscale in .env).
  tailscale:
    image: tailscale/tailscale:v1.104.4
    profiles: ["tailscale"]
    hostname: ${TS_HOSTNAME:-researchos}
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/config/entrypoint.sh"]
    environment:
      TS_HOSTNAME: ${TS_HOSTNAME:-researchos}
      # Optional: a pre-auth key from https://login.tailscale.com/admin/settings/keys
      # If empty, `docker compose logs tailscale` prints a login URL to open once.
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_EXTRA_ARGS: ${TS_EXTRA_ARGS:-}
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./docker/tailscale/entrypoint.sh:/config/entrypoint.sh:ro
    depends_on:
      - researchos

volumes:
  researchos-data:
    name: ${RESEARCHOS_VOLUME:-researchos-data}
  tailscale-state:
    name: ${TS_STATE_VOLUME:-researchos-tailscale-state}
