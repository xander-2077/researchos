# Template: replace <SERVER_PUBLIC_IP> and <SERVER_PRIVATE_IP> before installing.
# Bind explicitly to avoid the SSH tunnel on 127.0.0.1:10001.
server {
    listen <SERVER_PRIVATE_IP>:10001 default_server;
    server_name <SERVER_PUBLIC_IP>;
    client_max_body_size 12m;  # image uploads are capped at 10 MB by the app

    location / {
        proxy_pass http://127.0.0.1:10001;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
