# Template: generate with python3 scripts/render-deployment.py before installing.
# Bind to the cloud interface separately from the SSH tunnel's loopback listener.
server {
    listen ${PROXY_LISTEN_IP}:${PROXY_PORT} default_server;
    server_name ${SERVER_NAME};
    client_max_body_size 12m;  # image uploads are capped at 10 MB by the app

    location / {
        proxy_pass http://127.0.0.1:${TUNNEL_PORT};
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
