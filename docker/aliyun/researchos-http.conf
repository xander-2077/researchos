# Bootstrap HTTP-01 validation before the HTTPS certificate exists.
server {
    listen 80;
    listen [::]:80;
    server_name research.example.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/researchos-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://research.example.com$request_uri;
    }
}
